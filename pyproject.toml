[project]
name = "django-drf-pdm-template"
version = "1.0.0"
description = "Template Django DRF PDM com usuário, JWT e uploader do tutorial do Marco André"
requires-python = ">=3.10"
dependencies = [
  "django>=5.2,<6.0",
  "djangorestframework>=3.15,<4.0",
  "djangorestframework-simplejwt>=5.5,<6.0",
  "drf-spectacular>=0.28,<1.0",
  "dj-database-url>=2.1,<4.0",
  "django-cloudinary-storage>=0.3.0",
  "cloudinary>=1.40",
  "django-cors-headers>=4.3",
  "django-extensions>=3.2.3",
  "django-filter>=23.3",
  "pillow>=10.3",
  "python-dotenv>=1.0",
  "python-magic-bin>=0.4.14; sys_platform == 'win32'",
  "python-magic>=0.4.27; sys_platform == 'linux'",
  "python-magic>=0.4.27; sys_platform == 'darwin'",
  "gunicorn>=21.2",
  "psycopg2-binary>=2.9.9",
  "whitenoise[brotli]>=6.6",
  "pydotplus>=2.0",
]

[dependency-groups]
dev = ["ruff>=0.11", "pre-commit>=3.5"]

[tool.pdm]
distribution = false

[tool.pdm.scripts]
dev = "python manage.py runserver 127.0.0.1:8000"
createsuperuser = "python manage.py createsuperuser"
makemigrations = "python manage.py makemigrations"
migrate = "python manage.py migrate"
diagram = "python manage.py graph_models -S -g -o core.png core uploader"
test = "python manage.py test"
check = "python manage.py check"
shell = "python manage.py shell"
shellp = "python manage.py shell_plus"
format = "ruff format ."
lint = "ruff check ."

[tool.ruff]
line-length = 120
extend-exclude = ["migrations"]

[tool.ruff.format]
quote-style = "single"
