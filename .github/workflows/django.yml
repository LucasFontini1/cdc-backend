name: Django checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDM
        run: pip install "pdm>=2.20"
      - name: Install dependencies
        run: pdm install
      - name: Django system check
        run: pdm run python manage.py check
      - name: Check migrations
        run: pdm run python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: pdm run test
